name: CI

on:
  push:
    branches: [main, diego]
  pull_request:

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    # El contexto `secrets` no se puede usar dentro de un `if:` (restricción
    # de GitHub Actions, no un typo); por eso se refleja primero en env a
    # nivel de job y el `if:` del paso de Sonar compara `env.SONAR_TOKEN`.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test -- --ci --coverage

      # Escaneo de mantenibilidad (duplicación, code smells, cobertura).
      # No falla el build si el secret no está configurado: falta crear
      # el proyecto en SonarCloud y guardar SONAR_TOKEN (y opcionalmente
      # SONAR_ORGANIZATION / SONAR_PROJECT_KEY) como secret del repo —
      # eso es un paso manual en sonarcloud.io + GitHub.
      - name: SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY || 'planazo-promo' }}

      - name: Compilar
        run: npm run build

      - name: Construir imagen Docker
        run: docker build -t $GITHUB_REPOSITORY:ci .
