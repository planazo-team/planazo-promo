# Escenario 5 (Mantenibilidad): análisis estático con SonarCloud.
# sonar.organization / sonar.projectKey / sonar.host.url se pasan como
# -D desde .github/workflows/ci.yml (secrets); aquí solo lo que es propio
# de este repo.
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
