# Análisis estático con SonarCloud (ESC-05, inspección continua).
# Guía completa: https://github.com/planazo-team/planazo-frontend/blob/main/docs/sprint-2/sonarcloud.md
sonar.organization=planazo-team
sonar.projectKey=planazo-team_planazo-promo
sonar.projectName=planazo-promo
sonar.sourceEncoding=UTF-8

# Código de producción y pruebas (las specs viven junto al código en src/)
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts
sonar.exclusions=src/**/*.spec.ts,**/node_modules/**,dist/**,coverage/**

# Cobertura: Jest genera coverage/lcov.info con "npm test -- --coverage".
# main.ts solo arranca Nest (mismo criterio que collectCoverageFrom en package.json).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/main.ts
